
name: Build APP HIDE PRO APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q AppHidePro_Starter.zip -d .

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p AppHidePro assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: APP-HIDE-PRO-APK
          path: AppHidePro/app/build/outputs/apk/debug/app-debug.apk
